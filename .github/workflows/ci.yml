name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the development host; Ubuntu proves the rules, digests and golden hashes are
        # byte-identical across operating systems.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A guard against a hang, not a performance assertion (a healthy run takes a few minutes).
    timeout-minutes: 30

    # The committed .npmrc pins the corporate npm proxy, which is correct on the development
    # machine and unreachable from a hosted runner. An environment variable outranks a project
    # .npmrc, so this selects the public registry for every npm invocation in the job, including
    # npm started from inside `npm run verify`. The other half: package-lock.json keeps canonical
    # https://registry.npmjs.org/ URLs (npm ci fetches the lockfile's own URLs).
    # test/tooling/lockfile-registry.test.ts enforces both; `npm run lockfile:fix` repairs it.
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # The one gate, exactly as run locally: build, typecheck (rules, app, worker, tests), lint,
      # format check, content validation, unit/trace/tooling tests and the lockfile check.
      - name: Verify
        run: npm run verify

      # A second, independent path to red. scripts/verify.mjs records every step it ran; this
      # step re-reads that record outside npm, so a lost exit code cannot turn a failure green.
      - name: Audit that every verify step ran and passed
        if: always()
        run: node scripts/verify.mjs --audit .verify-report.json

  e2e:
    name: e2e (${{ matrix.engine }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    # Each engine runs in parallel jobs, one or more parts of the suite each
    # (test/e2e/support/parts.ts), balanced by measured run times so every job takes about seven
    # minutes: Chromium and Firefox in three jobs with two workers each (the performance timings
    # are judged only with two); WebKit, about twice as slow per test on a hosted runner, in one
    # job per part with three workers each (its tests mostly wait on the engine, so a third worker
    # on the 4-vCPU runner shortens a job; docs/testing.md §5).
    # Every part runs once per engine (test/e2e/harness.spec.ts checks this matrix).
    # The limit is a guard against a hang: room for a slow package mirror, not a budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, label: walks+rest, part: 'walks,rest', workers: 2 }
          - {
              engine: chromium,
              label: rounds+controls+playtest,
              part: 'rounds,controls,playtest',
              workers: 2,
            }
          - {
              engine: chromium,
              label: regions+valley+activities+days,
              part: 'regions,valley,activities,days',
              workers: 2,
            }
          - { engine: firefox, label: walks+rest, part: 'walks,rest', workers: 2 }
          - {
              engine: firefox,
              label: rounds+controls+playtest,
              part: 'rounds,controls,playtest',
              workers: 2,
            }
          - {
              engine: firefox,
              label: regions+valley+activities+days,
              part: 'regions,valley,activities,days',
              workers: 2,
            }
          - { engine: webkit, label: walks, part: walks, workers: 3 }
          - { engine: webkit, label: rounds, part: rounds, workers: 3 }
          - { engine: webkit, label: rest, part: rest, workers: 3 }
          - { engine: webkit, label: regions, part: regions, workers: 3 }
          - { engine: webkit, label: valley, part: valley, workers: 3 }
          - { engine: webkit, label: activities+playtest, part: 'activities,playtest', workers: 3 }
          - { engine: webkit, label: days, part: days, workers: 3 }
          - { engine: webkit, label: controls, part: controls, workers: 3 }
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # test/e2e/support/qa-reporter.ts: every spec (of the parts) must run, no unexplained skips.
      DV_E2E_AUDIT: '1'
      DV_E2E_PART: ${{ matrix.part }}
      # Artifact names: one set per job.
      DV_E2E_JOB: ${{ matrix.engine }}-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Hosted runners download Playwright's own engines; the development machine uses the system
      # Edge/Chrome channel instead (see playwright.config.ts). Not cached: the browser download
      # is 4-9 s of this step and the rest is the system packages (apt, 15-45 s), which a cache of
      # ~/.cache/ms-playwright would not skip (measured, docs/testing.md §5).
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      # Every test runs under the global guards (no console output, no failed or foreign
      # requests, no outbound links), and the job summary lists known defects and axe advice
      # (docs/testing.md §5).
      - name: End-to-end and accessibility on ${{ matrix.engine }}
        run: npx playwright test --project=${{ matrix.engine }} --workers=${{ matrix.workers }}

      # Screens for human review at tablet, desktop and phone sizes (docs/qa/screens.md); only the
      # walks take them: qa-screens-chromium-walks+rest, -firefox-walks+rest and -webkit-walks.
      - name: Upload the screens for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screens-${{ env.DV_E2E_JOB }}
          path: out/qa-screens/
          if-no-files-found: ${{ contains(matrix.part, 'walks') && 'warn' || 'ignore' }}
          retention-days: 30

      # The HTML report carries every axe result and guard report as attachments.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.DV_E2E_JOB }}
          path: |
            playwright-report/
            test-results/qa-summary.md
            test-results/results.json
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ env.DV_E2E_JOB }}
          path: test-results/
          retention-days: 14
